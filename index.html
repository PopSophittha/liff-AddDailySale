<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

/****************************************************
 * LIFF
 ****************************************************/

const LIFF_ID =
  '2007788493-ViOpm5bx';


const API_URL =
  'https://script.google.com/macros/s/AKfycbzCXzsvORwlVAsW9D76WzMY3ignrwT9mtd6SKNlxpD4oDMqt3Pbp4rLAzk-kwIbVHn_/exec';


/****************************************************
 * FIXED STORE CONFIG
 *
 * ================================================
 * แก้รายชื่อพนักงานจริงตรงนี้
 * ================================================
 ****************************************************/

const FIXED_CONFIGS = {

  M1: {

    shop: 'M1',

    employees: [
      'น้อง A',
      'น้อง B',
      'น้อง C'
    ]

  },


  M85: {

    shop: 'M85',

    employees: [
      'น้อง A',
      'น้อง B',
      'น้อง C'
    ]

  },


  M95: {

    shop: 'M95',

    employees: [
      'น้อง A',
      'น้อง B',
      'น้อง C'
    ]

  },


  M89: {

    shop: 'M89',

    employees: [
      'น้อง A',
      'น้อง B',
      'น้อง C'
    ]

  }

};


/****************************************************
 * SHIFT
 ****************************************************/

const SHIFT_OPTIONS = [

  '09.00-14.00',

  '14.00-18.00',

  '18.00-23.00'

];


/****************************************************
 * VARIABLES
 ****************************************************/

let lineProfile = null;

let currentEmployees = [];

let selectedEmployees = [];

let selectedShifts = [];

let currentShop = '';

let imageData = null;


/****************************************************
 * INIT
 ****************************************************/

window.addEventListener(
  'load',
  init
);


async function init() {

  setToday();


  try {

    if (
      !LIFF_ID
    ) {

      throw new Error(
        'ยังไม่ได้ใส่ LIFF ID'
      );

    }


    /**********************************************
     * LIFF INIT
     **********************************************/

    await liff.init({

      liffId:
        LIFF_ID

    });


    /**********************************************
     * LOGIN
     **********************************************/

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /**********************************************
     * PROFILE
     **********************************************/

    lineProfile =
      await liff.getProfile();


    document
      .getElementById(
        'userInfo'
      )
      .innerText =
        'ผู้ส่ง: ' +
        lineProfile.displayName;


    /**********************************************
     * LOAD LOCAL CONFIG
     **********************************************/

    initializeFixedConfig();

  }

  catch (error) {

    console.error(
      error
    );


    alert(
      'ไม่สามารถเปิดระบบได้\n\n' +
      error.message
    );

  }

}


/****************************************************
 * FIXED CONFIG INIT
 ****************************************************/

function initializeFixedConfig() {

  const shopSelect =
    document.getElementById(
      'shop'
    );


  if (!shopSelect) {

    return;

  }


  /**********************************************
   * ร้านทั้งหมด
   **********************************************/

  shopSelect.innerHTML =
    '<option value="">-- เลือกร้าน --</option>';


  Object.keys(
    FIXED_CONFIGS
  ).forEach(
    function(shop) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        shop;


      option.textContent =
        shop;


      shopSelect.appendChild(
        option
      );

    }
  );


  currentShop = '';

  currentEmployees = [];

  selectedEmployees = [];

  renderEmployees([]);

  updateSelectedEmployees();

}


/****************************************************
 * GET FIXED CONFIG
 ****************************************************/

function getFixedConfig(
  shop
) {

  return (
    FIXED_CONFIGS[shop] ||
    null
  );

}


/****************************************************
 * SHOP CHANGED
 ****************************************************/

function shopChanged() {

  const shop =
    document
      .getElementById(
        'shop'
      )
      .value;


  currentShop =
    shop;


  selectedEmployees = [];


  const config =
    getFixedConfig(
      shop
    );


  if (!config) {

    currentEmployees = [];

    renderEmployees([]);

    updateSelectedEmployees();

    return;

  }


  /**********************************************
   * ใช้พนักงานของร้านนั้นทันที
   **********************************************/

  currentEmployees =
    Array.isArray(
      config.employees
    )
      ? [
          ...config.employees
        ]
      : [];


  renderEmployees(
    currentEmployees
  );


  updateSelectedEmployees();

}


/****************************************************
 * RENDER EMPLOYEES
 ****************************************************/

function renderEmployees(
  staff
) {

  const list =
    document.getElementById(
      'employeeList'
    );


  if (!list) {

    return;

  }


  list.innerHTML = '';


  if (
    !staff ||
    !staff.length
  ) {

    list.innerHTML =
      '<div style="padding:15px;">' +
      'กรุณาเลือกร้านก่อน' +
      '</div>';

    return;

  }


  staff.forEach(
    function(
      name,
      index
    ) {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'employee-item';


      const checkbox =
        document.createElement(
          'input'
        );


      checkbox.type =
        'checkbox';


      checkbox.id =
        'staff_' +
        index;


      checkbox.value =
        name;


      checkbox.addEventListener(
        'change',
        employeeChanged
      );


      const label =
        document.createElement(
          'label'
        );


      label.htmlFor =
        checkbox.id;


      label.textContent =
        name;


      row.appendChild(
        checkbox
      );


      row.appendChild(
        label
      );


      list.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      'employeeSelector'
    )
    .innerText =
      'แตะเพื่อเลือกพนักงาน';

}


/****************************************************
 * TOGGLE EMPLOYEES
 ****************************************************/

function toggleEmployees() {

  const list =
    document.getElementById(
      'employeeList'
    );


  if (
    !currentEmployees.length
  ) {

    return;

  }


  list.classList.toggle(
    'show'
  );

}


/****************************************************
 * EMPLOYEE CHANGED
 ****************************************************/

function employeeChanged() {

  const checkboxes =
    document.querySelectorAll(
      '#employeeList input[type="checkbox"]'
    );


  selectedEmployees = [];


  checkboxes.forEach(
    function(cb) {

      if (
        cb.checked
      ) {

        selectedEmployees.push(
          cb.value
        );

      }

    }
  );


  updateSelectedEmployees();

}


/****************************************************
 * UPDATE EMPLOYEES
 ****************************************************/

function updateSelectedEmployees() {

  const box =
    document.getElementById(
      'selectedEmployees'
    );


  const selector =
    document.getElementById(
      'employeeSelector'
    );


  if (
    !selectedEmployees.length
  ) {

    box.innerText =
      'ยังไม่ได้เลือกพนักงาน';


    if (
      currentEmployees.length
    ) {

      selector.innerText =
        'แตะเพื่อเลือกพนักงาน';

    }


    return;

  }


  box.innerText =
    'เลือกแล้ว ' +
    selectedEmployees.length +
    ' คน: ' +
    selectedEmployees.join(
      ', '
    );


  selector.innerText =
    'เลือกพนักงานแล้ว ' +
    selectedEmployees.length +
    ' คน';

}


/****************************************************
 * SHIFT
 ****************************************************/

function toggleShifts() {

  const list =
    document.getElementById(
      'shiftList'
    );


  if (!list) {

    return;

  }


  list.classList.toggle(
    'show'
  );

}


/****************************************************
 * SHIFT CHANGED
 ****************************************************/

function shiftChanged() {

  const checkboxes =
    document.querySelectorAll(
      '#shiftList input[type="checkbox"]'
    );


  selectedShifts = [];


  checkboxes.forEach(
    function(cb) {

      if (
        cb.checked
      ) {

        selectedShifts.push(
          cb.value
        );

      }

    }
  );


  updateSelectedShifts();

}


/****************************************************
 * UPDATE SHIFT
 ****************************************************/

function updateSelectedShifts() {

  const selector =
    document.getElementById(
      'shiftSelector'
    );


  const box =
    document.getElementById(
      'selectedShifts'
    );


  if (
    !selector ||
    !box
  ) {

    return;

  }


  if (
    !selectedShifts.length
  ) {

    selector.innerText =
      'แตะเพื่อเลือกกะ';


    box.innerText =
      'ยังไม่ได้เลือกกะ';

    return;

  }


  selector.innerText =
    'เลือกแล้ว ' +
    selectedShifts.length +
    ' กะ';


  box.innerText =
    selectedShifts.join(
      ', '
    );

}


/****************************************************
 * DATE
 ****************************************************/

function setToday() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );


  document
    .getElementById(
      'date'
    )
    .value =
      year +
      '-' +
      month +
      '-' +
      day;

}


/****************************************************
 * SALES CHECK
 ****************************************************/

function checkSales() {

  const total =
    getNumber(
      'totalSales'
    );


  const cash =
    getNumber(
      'cash'
    );


  const credit =
    getNumber(
      'credit'
    );


  const qr =
    getNumber(
      'qr'
    );


  const sum =
    cash +
    credit +
    qr;


  const box =
    document.getElementById(
      'salesCheck'
    );


  if (
    !total &&
    !sum
  ) {

    box.className =
      'check-box';


    box.innerText =
      'กรุณากรอกยอดขาย';


    return false;

  }


  if (
    Math.abs(
      total -
      sum
    ) < 0.01
  ) {

    box.className =
      'check-box ok';


    box.innerText =
      '✓ ยอดขายถูกต้อง';


    return true;

  }


  box.className =
    'check-box error';


  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    money(total) +
    ' ≠ ' +
    money(sum);


  return false;

}


/****************************************************
 * EMPLOYEE SALES CHECK
 ****************************************************/

function checkEmployeeSales() {

  const total =
    getNumber(
      'employeeTotal'
    );


  const cash =
    getNumber(
      'employeeCash'
    );


  const qr =
    getNumber(
      'employeeQr'
    );


  const sum =
    cash +
    qr;


  const box =
    document.getElementById(
      'employeeCheck'
    );


  if (
    !total &&
    !sum
  ) {

    box.className =
      'check-box';


    box.innerText =
      'กรุณากรอกยอดพนักงานซื้อ';


    return true;

  }


  if (
    Math.abs(
      total -
      sum
    ) < 0.01
  ) {

    box.className =
      'check-box ok';


    box.innerText =
      '✓ ยอดพนักงานซื้อถูกต้อง';


    return true;

  }


  box.className =
    'check-box error';


  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    money(total) +
    ' ≠ ' +
    money(sum);


  return false;

}


/****************************************************
 * PHOTO
 ****************************************************/

function photoSelected(
  event
) {

  const file =
    event
      .target
      .files[0];


  if (!file) {

    return;

  }


  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'กรุณาเลือกไฟล์รูปภาพ'
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      imageData = {

        data:
          e.target.result,

        name:
          file.name,

        mimeType:
          file.type

      };


      const preview =
        document.getElementById(
          'photoPreview'
        );


      preview.src =
        e.target.result;


      preview.style.display =
        'block';


      document
        .getElementById(
          'photoText'
        )
        .innerHTML =
          '✓ เลือกรูปแล้ว';

    };


  reader.readAsDataURL(
    file
  );

}


/****************************************************
 * SUBMIT
 ****************************************************/

async function submitForm() {

  const shop =
    currentShop ||
    document
      .getElementById(
        'shop'
      )
      .value;


  const date =
    document
      .getElementById(
        'date'
      )
      .value;


  /**************************************************
   * SHOP
   **************************************************/

  if (!shop) {

    alert(
      'กรุณาเลือกร้าน'
    );

    return;

  }


  /**************************************************
   * DATE
   **************************************************/

  if (!date) {

    alert(
      'กรุณาเลือกวันที่'
    );

    return;

  }


  /**************************************************
   * SHIFT
   **************************************************/

  if (
    !selectedShifts.length
  ) {

    alert(
      'กรุณาเลือกกะอย่างน้อย 1 กะ'
    );

    return;

  }


  /**************************************************
   * EMPLOYEE
   **************************************************/

  if (
    !selectedEmployees.length
  ) {

    alert(
      'กรุณาเลือกพนักงานอย่างน้อย 1 คน'
    );

    return;

  }


  /**************************************************
   * SALES
   **************************************************/

  if (!checkSales()) {

    alert(
      'กรุณาตรวจสอบยอดขาย\n\n' +
      'เงินสด + เครดิต + QR ' +
      'ต้องเท่ากับรวมยอดขาย'
    );

    return;

  }


  /**************************************************
   * EMPLOYEE SALES
   **************************************************/

  if (
    !checkEmployeeSales()
  ) {

    alert(
      'กรุณาตรวจสอบยอดพนักงานซื้อ\n\n' +
      'เงินสด + QR ' +
      'ต้องเท่ากับรวมพนักงานซื้อ'
    );

    return;

  }


  /**************************************************
   * PHOTO
   **************************************************/

  if (!imageData) {

    alert(
      'กรุณาแนบรูปใบส่งยอด'
    );

    return;

  }


  /**************************************************
   * DATA
   **************************************************/

  const data = {

    lineUserId:

      lineProfile
        ? lineProfile.userId
        : '',


    lineName:

      lineProfile
        ? lineProfile.displayName
        : '',


    shop:
      shop,


    date:
      date,


    shift:
      selectedShifts.join(
        ', '
      ),


    totalSales:
      getNumber(
        'totalSales'
      ),


    cash:
      getNumber(
        'cash'
      ),


    credit:
      getNumber(
        'credit'
      ),


    qr:
      getNumber(
        'qr'
      ),


    employeeTotal:
      getNumber(
        'employeeTotal'
      ),


    employeeCash:
      getNumber(
        'employeeCash'
      ),


    employeeQr:
      getNumber(
        'employeeQr'
      ),


    simSales:
      getNumber(
        'simSales'
      ),


    employees:
      selectedEmployees,


    image:
      imageData

  };


  /**************************************************
   * LOADING
   **************************************************/

  showLoading(
    'กำลังส่งข้อมูล...'
  );


  document
    .getElementById(
      'submitBtn'
    )
    .disabled = true;


  try {

    await apiPost(
      data
    );


    hideLoading();


    alert(
      '✓ ส่งรายงานเรียบร้อยแล้ว'
    );


    if (
      typeof liff !==
      'undefined' &&
      liff.isInClient()
    ) {

      liff.closeWindow();

    }

    else {

      resetForm();

    }

  }

  catch (error) {

    hideLoading();


    document
      .getElementById(
        'submitBtn'
      )
      .disabled = false;


    alert(
      'เกิดข้อผิดพลาด\n\n' +
      error.message
    );

  }

}


/****************************************************
 * POST API
 ****************************************************/

function apiPost(
  data
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      try {

        fetch(
          API_URL,
          {

            method:
              'POST',

            mode:
              'no-cors',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify(
                data
              )

          }
        )
        .then(
          function() {

            resolve({
              success: true
            });

          }
        )
        .catch(
          function(error) {

            reject(
              error
            );

          }
        );

      }

      catch (error) {

        reject(
          error
        );

      }

    }
  );

}


/****************************************************
 * RESET
 ****************************************************/

function resetForm() {

  [

    'totalSales',

    'cash',

    'credit',

    'qr',

    'employeeTotal',

    'employeeCash',

    'employeeQr',

    'simSales'

  ]
  .forEach(
    function(id) {

      document
        .getElementById(id)
        .value = '';

    }
  );


  selectedEmployees = [];


  selectedShifts = [];


  document
    .querySelectorAll(
      '#shiftList input[type="checkbox"]'
    )
    .forEach(
      function(cb) {

        cb.checked = false;

      }
    );


  updateSelectedShifts();


  imageData = null;


  document
    .getElementById(
      'photo'
    )
    .value = '';


  document
    .getElementById(
      'photoPreview'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'photoText'
    )
    .innerHTML =
      '📷<br>' +
      'แตะเพื่อถ่ายรูป<br>' +
      '<small>' +
      'หรือเลือกรูปจากเครื่อง' +
      '</small>';


  updateSelectedEmployees();


  document
    .getElementById(
      'submitBtn'
    )
    .disabled =
      false;


  checkSales();


  checkEmployeeSales();

}


/****************************************************
 * NUMBER
 ****************************************************/

function getNumber(
  id
) {

  return Number(
    document
      .getElementById(id)
      .value
  ) || 0;

}


/****************************************************
 * MONEY
 ****************************************************/

function money(
  value
) {

  return Number(
    value || 0
  )
    .toLocaleString(
      'th-TH',
      {

        minimumFractionDigits:
          2,

        maximumFractionDigits:
          2

      }
    );

}


/****************************************************
 * LOADING
 ****************************************************/

function showLoading(
  text
) {

  document
    .getElementById(
      'loadingText'
    )
    .innerText =
      text ||
      'กำลังโหลด...';


  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'show'
    );

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList.remove(
      'show'
    );

}

</script>
