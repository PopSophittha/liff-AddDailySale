<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>รายงานยอดขาย</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #222;
    }


    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }


    .header {
      background: #06c755;
      color: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
    }


    .header h1 {
      margin: 0;
      font-size: 24px;
    }


    .header p {
      margin: 6px 0 0;
      opacity: .9;
    }


    .user-info {
      margin-top: 10px;
      font-size: 13px;
      opacity: .9;
    }


    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }


    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }


    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }


    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 13px;
      font-size: 16px;
      background: white;
      margin-bottom: 14px;
      outline: none;
    }


    input:focus,
    select:focus {
      border-color: #06c755;
    }


    .money-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }


    /* EMPLOYEE */

    .employee-selector {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      min-height: 48px;
      cursor: pointer;
      background: white;
      margin-bottom: 8px;
    }


    .employee-list {
      display: none;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
      background: white;
    }


    .employee-list.show {
      display: block;
    }


    .employee-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }


    .employee-item:last-child {
      border-bottom: none;
    }


    .employee-item input {
      width: 20px;
      height: 20px;
      margin: 0;
      flex-shrink: 0;
    }


    .employee-item label {
      flex: 1;
      margin: 0;
      cursor: pointer;
      font-weight: 500;
    }


    .selected-employees {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }


    /* CHECK */

    .check-box {
      padding: 12px;
      border-radius: 12px;
      background: #f4fff7;
      border: 1px solid #c7efd4;
      margin-bottom: 5px;
      font-size: 14px;
    }


    .check-box.ok {
      color: #087f35;
    }


    .check-box.error {
      background: #fff4f4;
      border-color: #ffcaca;
      color: #d00000;
    }


    /* PHOTO */

    .photo-box {
      border: 2px dashed #ccc;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 0;
      cursor: pointer;
      display: block;
    }


    .photo-box input {
      display: none;
    }


    .photo-preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      display: none;
      margin-top: 12px;
    }


    /* BUTTON */

    .submit-btn {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 15px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
    }


    .submit-btn:disabled {
      opacity: .5;
    }


    /* LOADING */

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }


    .loading.show {
      display: flex;
    }


    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #ddd;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .required {
      color: #d00;
    }


    @media (max-width: 400px) {

      .container {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .money-row {
        gap: 7px;
      }

    }

  </style>

</head>


<body>


<!-- LOADING -->

<div
  class="loading"
  id="loading"
>

  <div class="spinner"></div>

  <div id="loadingText">
    กำลังบันทึกข้อมูล...
  </div>

</div>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      รายงานยอดขาย
    </h1>

    <p>
      กรอกยอดขายประจำวัน
    </p>

    <div
      class="user-info"
      id="userInfo"
    >
      กำลังโหลดข้อมูล LINE...
    </div>

  </div>


  <!-- ข้อมูลรายงาน -->

  <div class="card">

    <div class="section-title">
      📋 ข้อมูลรายงาน
    </div>


    <label>
      ร้าน <span class="required">*</span>
    </label>

    <select
      id="shop"
      onchange="shopChanged()"
    >

      <option value="">
        กำลังโหลด...
      </option>

    </select>


    <label>
      วันที่ <span class="required">*</span>
    </label>

    <input
      type="date"
      id="date"
    >


    <label>
      กะ <span class="required">*</span>
    </label>

    <select id="shift">

      <option value="">
        -- เลือกกะ --
      </option>

      <option value="เช้า">
        เช้า
      </option>

      <option value="บ่าย">
        บ่าย
      </option>

      <option value="ดึก">
        ดึก
      </option>

    </select>

  </div>


  <!-- พนักงาน -->

  <div class="card">

    <div class="section-title">
      👥 พนักงาน
    </div>


    <label>
      เลือกพนักงาน
      <span class="required">*</span>
    </label>


    <div
      class="employee-selector"
      id="employeeSelector"
      onclick="toggleEmployees()"
    >
      กรุณาเลือกร้านก่อน
    </div>


    <div
      class="employee-list"
      id="employeeList"
    >
    </div>


    <div
      class="selected-employees"
      id="selectedEmployees"
    >
      ยังไม่ได้เลือกพนักงาน
    </div>

  </div>


  <!-- ยอดขาย -->

  <div class="card">

    <div class="section-title">
      💰 ยอดขาย
    </div>


    <label>
      รวมยอดขาย <span class="required">*</span>
    </label>

    <input
      type="number"
      id="totalSales"
      placeholder="0"
      min="0"
      step="0.01"
      inputmode="decimal"
      oninput="checkSales()"
    >


    <div class="money-row">

      <div>

        <label>
          เงินสด
        </label>

        <input
          type="number"
          id="cash"
          placeholder="0"
          min="0"
          step="0.01"
          inputmode="decimal"
          oninput="checkSales()"
        >

      </div>


      <div>

        <label>
          เครดิต
        </label>

        <input
          type="number"
          id="credit"
          placeholder="0"
          min="0"
          step="0.01"
          inputmode="decimal"
          oninput="checkSales()"
        >

      </div>

    </div>


    <label>
      คิวอาร์โค้ด
    </label>

    <input
      type="number"
      id="qr"
      placeholder="0"
      min="0"
      step="0.01"
      inputmode="decimal"
      oninput="checkSales()"
    >


    <div
      class="check-box"
      id="salesCheck"
    >
      กรุณากรอกยอดขาย
    </div>

  </div>


  <!-- พนักงานซื้อ -->

  <div class="card">

    <div class="section-title">
      🛍️ ยอดพนักงานซื้อ
    </div>


    <label>
      รวมพนักงานซื้อ
    </label>

    <input
      type="number"
      id="employeeTotal"
      placeholder="0"
      min="0"
      step="0.01"
      inputmode="decimal"
      oninput="checkEmployeeSales()"
    >


    <div class="money-row">

      <div>

        <label>
          พนักงาน เงินสด
        </label>

        <input
          type="number"
          id="employeeCash"
          placeholder="0"
          min="0"
          step="0.01"
          inputmode="decimal"
          oninput="checkEmployeeSales()"
        >

      </div>


      <div>

        <label>
          พนักงาน คิวอาร์โค้ด
        </label>

        <input
          type="number"
          id="employeeQr"
          placeholder="0"
          min="0"
          step="0.01"
          inputmode="decimal"
          oninput="checkEmployeeSales()"
        >

      </div>

    </div>


    <div
      class="check-box"
      id="employeeCheck"
    >
      กรุณากรอกยอดพนักงานซื้อ
    </div>

  </div>


  <!-- SIM -->

  <div class="card">

    <div class="section-title">
      📱 ยอดขายซิม
    </div>


    <label>
      ยอดขายซิม
    </label>

    <input
      type="number"
      id="simSales"
      placeholder="0"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

  </div>


  <!-- รูป -->

  <div class="card">

    <div class="section-title">
      📷 ใบส่งยอด
    </div>


    <label class="photo-box">

      <input
        type="file"
        id="photo"
        accept="image/*"
        capture="environment"
        onchange="photoSelected(event)"
      >


      <div id="photoText">

        📷

        <br>

        แตะเพื่อถ่ายรูป

        <br>

        <small>
          หรือเลือกรูปจากเครื่อง
        </small>

      </div>


      <img
        id="photoPreview"
        class="photo-preview"
      >

    </label>

  </div>


  <!-- SUBMIT -->

  <button
    class="submit-btn"
    id="submitBtn"
    onclick="submitForm()"
  >
    ส่งรายงานยอดขาย
  </button>


</div>



<script>

/****************************************************
 * CONFIG
 ****************************************************/

/*
 * ================================
 * ใส่ LIFF ID ของคุณตรงนี้
 * ================================
 *
 * ตัวอย่าง:
 *
 * const LIFF_ID =
 *   '2001234567-AbCdEfGh';
 *
 */

const LIFF_ID =
  '2007788493-ViOpm5bx';


/*
 * Google Apps Script Web App
 *
 * URL ของคุณ
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzCXzsvORwlVAsW9D76WzMY3ignrwT9mtd6SKNlxpD4oDMqt3Pbp4rLAzk-kwIbVHn_/exec';



/****************************************************
 * VARIABLES
 ****************************************************/

let lineProfile = null;

let currentEmployees = [];

let selectedEmployees = [];

let imageData = null;



/****************************************************
 * INIT
 ****************************************************/

window.addEventListener(
  'load',
  init
);


async function init() {

  setToday();


  try {

    if (
      !LIFF_ID ||
      LIFF_ID ===
        'ใส่-LIFF-ID-ตรงนี้'
    ) {

      throw new Error(
        'ยังไม่ได้ใส่ LIFF ID ใน index.html'
      );

    }


    /*
     * INIT LIFF
     */

    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * LOGIN
     */

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /*
     * GET PROFILE
     */

    lineProfile =
      await liff.getProfile();


    document
      .getElementById(
        'userInfo'
      )
      .innerText =
        'ผู้ส่ง: ' +
        lineProfile.displayName;


    /*
     * LOAD SHOPS
     */

    loadShops();

  }


  catch (error) {

    console.error(error);


    alert(
      'ไม่สามารถเปิดระบบได้\n\n' +
      error.message
    );

  }

}



/****************************************************
 * DATE
 ****************************************************/

function setToday() {

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );


  document
    .getElementById(
      'date'
    )
    .value =
      `${year}-${month}-${day}`;

}



/****************************************************
 * GET SHOPS
 ****************************************************/

function loadShops() {

  apiGet(
    'getShops'
  )

  .then(
    function(shops) {

      const select =
        document
          .getElementById(
            'shop'
          );


      select.innerHTML =
        '<option value="">-- เลือกร้าน --</option>';


      shops.forEach(
        function(shop) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            shop;


          option.textContent =
            shop;


          select.appendChild(
            option
          );

        }
      );

    }
  )

  .catch(
    function(error) {

      alert(
        'โหลดรายชื่อร้านไม่ได้\n\n' +
        error.message
      );

    }
  );

}



/****************************************************
 * SHOP CHANGED
 ****************************************************/

function shopChanged() {

  const shop =
    document
      .getElementById(
        'shop'
      )
      .value;


  selectedEmployees = [];


  currentEmployees = [];


  updateSelectedEmployees();


  const list =
    document
      .getElementById(
        'employeeList'
      );


  list.innerHTML = '';


  list.classList.remove(
    'show'
  );


  if (!shop) {

    document
      .getElementById(
        'employeeSelector'
      )
      .innerText =
        'กรุณาเลือกร้านก่อน';


    return;

  }


  document
    .getElementById(
      'employeeSelector'
    )
    .innerText =
      'กำลังโหลดรายชื่อพนักงาน...';


  apiGet(
    'getStaffByShop',
    {
      shop: shop
    }
  )

  .then(
    function(staff) {

      currentEmployees =
        staff;


      renderEmployees(
        staff
      );

    }
  )

  .catch(
    function(error) {

      alert(
        'โหลดพนักงานไม่ได้\n\n' +
        error.message
      );

    }
  );

}



/****************************************************
 * RENDER EMPLOYEES
 ****************************************************/

function renderEmployees(
  staff
) {

  const list =
    document
      .getElementById(
        'employeeList'
      );


  list.innerHTML = '';


  if (
    !staff ||
    !staff.length
  ) {

    list.innerHTML =
      '<div style="padding:15px;">' +
      'ไม่พบรายชื่อพนักงานของร้านนี้' +
      '</div>';


    return;

  }


  staff.forEach(
    function(name, index) {

      const row =
        document.createElement(
          'div'
        );


      row.className =
        'employee-item';


      const checkbox =
        document.createElement(
          'input'
        );


      checkbox.type =
        'checkbox';


      checkbox.id =
        'staff_' + index;


      checkbox.value =
        name;


      checkbox.addEventListener(
        'change',
        employeeChanged
      );


      const label =
        document.createElement(
          'label'
        );


      label.htmlFor =
        checkbox.id;


      label.textContent =
        name;


      row.appendChild(
        checkbox
      );


      row.appendChild(
        label
      );


      list.appendChild(
        row
      );

    }
  );


  document
    .getElementById(
      'employeeSelector'
    )
    .innerText =
      'แตะเพื่อเลือกพนักงาน';


  /*
   * เปิดรายการทันที
   */

  list.classList.add(
    'show'
  );

}



/****************************************************
 * TOGGLE EMPLOYEES
 ****************************************************/

function toggleEmployees() {

  const list =
    document
      .getElementById(
        'employeeList'
      );


  if (
    !currentEmployees.length
  ) {

    return;

  }


  list.classList.toggle(
    'show'
  );

}



/****************************************************
 * EMPLOYEE CHANGED
 ****************************************************/

function employeeChanged() {

  const checkboxes =
    document.querySelectorAll(
      '#employeeList input[type="checkbox"]'
    );


  selectedEmployees = [];


  checkboxes.forEach(
    function(cb) {

      if (
        cb.checked
      ) {

        selectedEmployees.push(
          cb.value
        );

      }

    }
  );


  updateSelectedEmployees();

}



/****************************************************
 * UPDATE EMPLOYEES
 ****************************************************/

function updateSelectedEmployees() {

  const box =
    document
      .getElementById(
        'selectedEmployees'
      );


  const selector =
    document
      .getElementById(
        'employeeSelector'
      );


  if (
    !selectedEmployees.length
  ) {

    box.innerText =
      'ยังไม่ได้เลือกพนักงาน';


    if (
      currentEmployees.length
    ) {

      selector.innerText =
        'แตะเพื่อเลือกพนักงาน';

    }


    return;

  }


  box.innerText =
    'เลือกแล้ว ' +
    selectedEmployees.length +
    ' คน: ' +
    selectedEmployees.join(
      ', '
    );


  selector.innerText =
    'เลือกพนักงานแล้ว ' +
    selectedEmployees.length +
    ' คน';

}



/****************************************************
 * SALES CHECK
 ****************************************************/

function checkSales() {

  const total =
    getNumber(
      'totalSales'
    );


  const cash =
    getNumber(
      'cash'
    );


  const credit =
    getNumber(
      'credit'
    );


  const qr =
    getNumber(
      'qr'
    );


  const sum =
    cash +
    credit +
    qr;


  const box =
    document
      .getElementById(
        'salesCheck'
      );


  if (
    !total &&
    !sum
  ) {

    box.className =
      'check-box';


    box.innerText =
      'กรุณากรอกยอดขาย';


    return false;

  }


  if (
    Math.abs(
      total - sum
    ) < 0.01
  ) {

    box.className =
      'check-box ok';


    box.innerText =
      '✓ ยอดขายถูกต้อง';


    return true;

  }


  box.className =
    'check-box error';


  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    money(total) +
    ' ≠ ' +
    money(sum);


  return false;

}



/****************************************************
 * EMPLOYEE SALES CHECK
 ****************************************************/

function checkEmployeeSales() {

  const total =
    getNumber(
      'employeeTotal'
    );


  const cash =
    getNumber(
      'employeeCash'
    );


  const qr =
    getNumber(
      'employeeQr'
    );


  const sum =
    cash +
    qr;


  const box =
    document
      .getElementById(
        'employeeCheck'
      );


  if (
    !total &&
    !sum
  ) {

    box.className =
      'check-box';


    box.innerText =
      'กรุณากรอกยอดพนักงานซื้อ';


    return false;

  }


  if (
    Math.abs(
      total - sum
    ) < 0.01
  ) {

    box.className =
      'check-box ok';


    box.innerText =
      '✓ ยอดพนักงานซื้อถูกต้อง';


    return true;

  }


  box.className =
    'check-box error';


  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    money(total) +
    ' ≠ ' +
    money(sum);


  return false;

}



/****************************************************
 * PHOTO
 ****************************************************/

function photoSelected(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  /*
   * จำกัดชนิดไฟล์
   */

  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'กรุณาเลือกไฟล์รูปภาพ'
    );


    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      imageData = {

        data:
          e.target.result,

        name:
          file.name,

        mimeType:
          file.type

      };


      const preview =
        document
          .getElementById(
            'photoPreview'
          );


      preview.src =
        e.target.result;


      preview.style.display =
        'block';


      document
        .getElementById(
          'photoText'
        )
        .innerHTML =
          '✓ เลือกรูปแล้ว';

    };


  reader.readAsDataURL(
    file
  );

}



/****************************************************
 * SUBMIT
 ****************************************************/

async function submitForm() {

  const shop =
    document
      .getElementById(
        'shop'
      )
      .value;


  const date =
    document
      .getElementById(
        'date'
      )
      .value;


  const shift =
    document
      .getElementById(
        'shift'
      )
      .value;


  /*
   * CHECK SHOP
   */

  if (!shop) {

    alert(
      'กรุณาเลือกร้าน'
    );


    return;

  }


  /*
   * CHECK DATE
   */

  if (!date) {

    alert(
      'กรุณาเลือกวันที่'
    );


    return;

  }


  /*
   * CHECK SHIFT
   */

  if (!shift) {

    alert(
      'กรุณาเลือกกะ'
    );


    return;

  }


  /*
   * CHECK EMPLOYEE
   */

  if (
    !selectedEmployees.length
  ) {

    alert(
      'กรุณาเลือกพนักงานอย่างน้อย 1 คน'
    );


    return;

  }


  /*
   * CHECK SALES
   */

  if (!checkSales()) {

    alert(
      'กรุณาตรวจสอบยอดขาย\n\n' +
      'เงินสด + เครดิต + QR ' +
      'ต้องเท่ากับรวมยอดขาย'
    );


    return;

  }


  /*
   * CHECK EMPLOYEE SALES
   */

  if (!checkEmployeeSales()) {

    alert(
      'กรุณาตรวจสอบยอดพนักงานซื้อ\n\n' +
      'เงินสด + QR ' +
      'ต้องเท่ากับรวมพนักงานซื้อ'
    );


    return;

  }


  /*
   * CHECK IMAGE
   */

  if (!imageData) {

    alert(
      'กรุณาแนบรูปใบส่งยอด'
    );


    return;

  }


  /*
   * DATA
   */

  const data = {

    lineUserId:
      lineProfile
        ? lineProfile.userId
        : '',


    lineName:
      lineProfile
        ? lineProfile.displayName
        : '',


    shop:
      shop,


    date:
      date,


    shift:
      shift,


    totalSales:
      getNumber(
        'totalSales'
      ),


    cash:
      getNumber(
        'cash'
      ),


    credit:
      getNumber(
        'credit'
      ),


    qr:
      getNumber(
        'qr'
      ),


    employeeTotal:
      getNumber(
        'employeeTotal'
      ),


    employeeCash:
      getNumber(
        'employeeCash'
      ),


    employeeQr:
      getNumber(
        'employeeQr'
      ),


    simSales:
      getNumber(
        'simSales'
      ),


    employees:
      selectedEmployees,


    image:
      imageData

  };


  /*
   * LOADING
   */

  showLoading(
    'กำลังส่งข้อมูล...'
  );


  document
    .getElementById(
      'submitBtn'
    )
    .disabled = true;


  try {

    await apiPost(
      data
    );


    hideLoading();


    alert(
      '✓ ส่งรายงานเรียบร้อยแล้ว'
    );


    /*
     * ปิด LIFF
     */

    if (
      typeof liff !== 'undefined' &&
      liff.isInClient()
    ) {

      liff.closeWindow();

    }

    else {

      resetForm();

    }

  }


  catch (error) {

    hideLoading();


    document
      .getElementById(
        'submitBtn'
      )
      .disabled = false;


    alert(
      'เกิดข้อผิดพลาด\n\n' +
      error.message
    );

  }

}



/****************************************************
 * RESET
 ****************************************************/

function resetForm() {

  [
    'totalSales',
    'cash',
    'credit',
    'qr',
    'employeeTotal',
    'employeeCash',
    'employeeQr',
    'simSales'
  ]
  .forEach(
    function(id) {

      document
        .getElementById(id)
        .value = '';

    }
  );


  selectedEmployees = [];


  imageData = null;


  document
    .getElementById(
      'photo'
    )
    .value = '';


  document
    .getElementById(
      'photoPreview'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'photoText'
    )
    .innerHTML =
      '📷<br>แตะเพื่อถ่ายรูป<br>' +
      '<small>หรือเลือกรูปจากเครื่อง</small>';


  updateSelectedEmployees();


  document
    .getElementById(
      'submitBtn'
    )
    .disabled = false;


  checkSales();


  checkEmployeeSales();

}



/****************************************************
 * API GET
 *
 * ใช้ JSONP
 *
 * เพราะหน้าเว็บอยู่ GitHub Pages
 ****************************************************/

function apiGet(
  action,
  params = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            query.set(
              key,
              params[key]
            );

          }
        );


      const script =
        document.createElement(
          'script'
        );


      let finished = false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                'เชื่อมต่อ Google Apps Script ไม่สำเร็จ'
              )
            );

          },
          15000
        );


      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timeout
          );


          cleanup();


          if (
            result &&
            result.success
          ) {

            resolve(
              result.data
            );

          }

          else {

            reject(
              new Error(
                result &&
                result.message
                  ? result.message
                  : 'API Error'
              )
            );

          }

        };


      function cleanup() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.src =
        API_URL +
        '?' +
        query.toString();


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timeout
          );


          cleanup();


          reject(
            new Error(
              'ไม่สามารถเชื่อมต่อ Google Apps Script'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}



/****************************************************
 * API POST
 *
 * GitHub Pages → Apps Script
 *
 * ใช้ no-cors
 ****************************************************/

function apiPost(
  data
) {

  return new Promise(
    function(resolve, reject) {

      try {

        fetch(
          API_URL,
          {
            method: 'POST',

            mode: 'no-cors',

            headers: {
              'Content-Type':
                'text/plain;charset=utf-8'
            },

            body:
              JSON.stringify(data)

          }
        )

        .then(
          function() {

            /*
             * no-cors อ่าน response
             * จาก Apps Script ไม่ได้
             *
             * แต่ request ถูกส่งออกแล้ว
             */

            resolve({
              success: true
            });

          }
        )

        .catch(
          function(error) {

            reject(error);

          }
        );

      }

      catch (error) {

        reject(error);

      }

    }
  );

}



/****************************************************
 * NUMBER
 ****************************************************/

function getNumber(
  id
) {

  return Number(
    document
      .getElementById(id)
      .value
  ) || 0;

}



/****************************************************
 * MONEY
 ****************************************************/

function money(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    'th-TH',
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}



/****************************************************
 * LOADING
 ****************************************************/

function showLoading(
  text
) {

  document
    .getElementById(
      'loadingText'
    )
    .innerText =
      text ||
      'กำลังโหลด...';


  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'show'
    );

}



function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList.remove(
      'show'
    );

}
