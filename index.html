<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>รายงานยอดขาย v4.4</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f6f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow:
        0 2px 10px rgba(0,0,0,.06);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .user-info {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    label.field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    select,
    input[type="date"],
    input[type="number"] {
      width: 100%;
      min-height: 48px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 16px;
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    .field {
      margin-bottom: 17px;
    }

    .employee-selector,
    .shift-selector {
      width: 100%;
      min-height: 48px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
    }

    .employee-list,
    .shift-list {
      display: none;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .employee-list.show,
    .shift-list.show {
      display: block;
    }

    .employee-item,
    .shift-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      margin: 0;
    }

    .employee-item:last-child,
    .shift-item:last-child {
      border-bottom: none;
    }

    .employee-item input,
    .shift-item input {
      width: 21px;
      height: 21px;
      margin: 0;
      flex-shrink: 0;
    }

    .selected-info {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .check-box {
      border-radius: 12px;
      padding: 13px;
      margin-top: 12px;
      background: #f4f4f4;
      font-size: 14px;
    }

    .check-box.ok {
      background: #e8f7ed;
      color: #157333;
    }

    .check-box.error {
      background: #fff0f0;
      color: #c62828;
    }

    .photo-upload {
      width: 100%;
      min-height: 150px;
      border: 2px dashed #ccc;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      background: #fafafa;
      position: relative;
    }

    .photo-upload input {
      display: none;
    }

    .photo-content {
      padding: 25px;
      color: #777;
    }

    #photoPreview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
    }

    .submit-btn {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: white;
      border-radius: 18px;
      padding: 25px 30px;
      text-align: center;
      min-width: 220px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .readonly-shop {
      width: 100%;
      min-height: 48px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      background: #f7f7f7;
      font-size: 16px;
      font-weight: 700;
    }

    .small-note {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 420px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      รายงานยอดขาย
    </h1>

    <div
      class="user-info"
      id="userInfo"
    >
      กำลังเข้าสู่ระบบ LINE...
    </div>

  </div>


  <!-- ==========================================
       STORE / EMPLOYEE
       ========================================== -->

  <div class="card">

    <div class="section-title">
      ข้อมูลร้าน
    </div>


    <div class="field">

      <label class="field-label">
        ร้าน
      </label>

      <select
        id="shop"
        onchange="shopChanged()"
      >

        <option value="">
          -- เลือกร้าน --
        </option>

        <option value="M1">
          M1
        </option>

        <option value="M85">
          M85
        </option>

        <option value="M95">
          M95
        </option>

        <option value="M89">
          M89
        </option>

      </select>

    </div>


    <div class="field">

      <label class="field-label">
        วันที่
      </label>

      <input
        type="date"
        id="date"
      >

    </div>


    <div class="field">

      <label class="field-label">
        กะ
      </label>

      <div
        class="shift-selector"
        id="shiftSelector"
        onclick="toggleShifts()"
      >
        แตะเพื่อเลือกกะ
      </div>


      <div
        class="shift-list"
        id="shiftList"
      >

        <label class="shift-item">

          <input
            type="checkbox"
            value="09.00-14.00"
            onchange="shiftChanged()"
          >

          <span>
            09.00-14.00
          </span>

        </label>


        <label class="shift-item">

          <input
            type="checkbox"
            value="14.00-18.00"
            onchange="shiftChanged()"
          >

          <span>
            14.00-18.00
          </span>

        </label>


        <label class="shift-item">

          <input
            type="checkbox"
            value="18.00-23.00"
            onchange="shiftChanged()"
          >

          <span>
            18.00-23.00
          </span>

        </label>

      </div>


      <div
        class="selected-info"
        id="selectedShifts"
      >
        ยังไม่ได้เลือกกะ
      </div>

    </div>


    <div class="field">

      <label class="field-label">
        ชื่อพนักงาน
      </label>


      <div
        class="employee-selector"
        id="employeeSelector"
        onclick="toggleEmployees()"
      >
        กรุณาเลือกร้านก่อน
      </div>


      <div
        class="employee-list"
        id="employeeList"
      >
      </div>


      <div
        class="selected-info"
        id="selectedEmployees"
      >
        ยังไม่ได้เลือกพนักงาน
      </div>

    </div>

  </div>


  <!-- ==========================================
       SALES
       ========================================== -->

  <div class="card">

    <div class="section-title">
      ยอดขาย
    </div>


    <div class="field">

      <label class="field-label">
        รวมยอดขาย
      </label>

      <input
        type="number"
        id="totalSales"
        inputmode="decimal"
        placeholder="0.00"
        oninput="checkSales()"
      >

    </div>


    <div class="grid">

      <div class="field">

        <label class="field-label">
          เงินสด
        </label>

        <input
          type="number"
          id="cash"
          inputmode="decimal"
          placeholder="0.00"
          oninput="checkSales()"
        >

      </div>


      <div class="field">

        <label class="field-label">
          เครดิต
        </label>

        <input
          type="number"
          id="credit"
          inputmode="decimal"
          placeholder="0.00"
          oninput="checkSales()"
        >

      </div>

    </div>


    <div class="field">

      <label class="field-label">
        คิวอาร์โค้ด
      </label>

      <input
        type="number"
        id="qr"
        inputmode="decimal"
        placeholder="0.00"
        oninput="checkSales()"
      >

    </div>


    <div
      class="check-box"
      id="salesCheck"
    >
      กรุณากรอกยอดขาย
    </div>

  </div>


  <!-- ==========================================
       EMPLOYEE PURCHASE
       ========================================== -->

  <div class="card">

    <div class="section-title">
      พนักงานซื้อ
    </div>


    <div class="field">

      <label class="field-label">
        รวมพนักงานซื้อ
      </label>

      <input
        type="number"
        id="employeeTotal"
        inputmode="decimal"
        placeholder="0.00"
        oninput="checkEmployeeSales()"
      >

    </div>


    <div class="grid">

      <div class="field">

        <label class="field-label">
          พนักงาน เงินสด
        </label>

        <input
          type="number"
          id="employeeCash"
          inputmode="decimal"
          placeholder="0.00"
          oninput="checkEmployeeSales()"
        >

      </div>


      <div class="field">

        <label class="field-label">
          พนักงาน คิวอาร์โค้ด
        </label>

        <input
          type="number"
          id="employeeQr"
          inputmode="decimal"
          placeholder="0.00"
          oninput="checkEmployeeSales()"
        >

      </div>

    </div>


    <div
      class="check-box"
      id="employeeCheck"
    >
      กรุณากรอกยอดพนักงานซื้อ
    </div>

  </div>


  <!-- ==========================================
       SIM
       ========================================== -->

  <div class="card">

    <div class="section-title">
      ยอดขายซิม
    </div>


    <input
      type="number"
      id="simSales"
      inputmode="decimal"
      placeholder="0.00"
    >

  </div>

  <!-- ==========================================
    * NOTE
     ========================================== -->

<div class="card">

  <div class="section-title">
    หมายเหตุ
  </div>

  <textarea
    id="note"
    placeholder="กรอกหมายเหตุเพิ่มเติม (ถ้ามี)"
    rows="4"
    style="
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:16px;
      font-family:inherit;
      resize:vertical;
      outline:none;
    "
  ></textarea>

</div>

  <!-- ==========================================
       PHOTO
       ========================================== -->

  <div class="card">

    <div class="section-title">
      ใบส่งยอด
    </div>


    <label
      class="photo-upload"
      for="photo"
    >

      <input
        type="file"
        id="photo"
        accept="image/*"
        onchange="photoSelected(event)"
      >


      <img
        id="photoPreview"
        alt="ตัวอย่างรูป"
      >


      <div
        class="photo-content"
        id="photoText"
      >

        📷<br>

        แตะเพื่อถ่ายรูป<br>

        <small>
          หรือเลือกรูปจากเครื่อง
        </small>

      </div>

    </label>

  </div>


  <!-- ==========================================
       SUBMIT
       ========================================== -->

  <button
    class="submit-btn"
    id="submitBtn"
    onclick="submitForm()"
  >
    ส่งรายงาน
  </button>

</div>


<!-- ==========================================
     LOADING
     ========================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div id="loadingText">
      กำลังส่งข้อมูล...
    </div>

  </div>

</div>


<script>

/****************************************************
 * LIFF CONFIG
 ****************************************************/

const LIFF_ID =
  '2007788493-ViOpm5bx';


const API_URL =
  'https://script.google.com/macros/s/AKfycbzCXzsvORwlVAsW9D76WzMY3ignrwT9mtd6SKNlxpD4oDMqt3Pbp4rLAzk-kwIbVHn_/exec';


/****************************************************
 * FIXED STORE / STAFF
 *
 * ==================================================
 * แก้รายชื่อพนักงานจริงตรงนี้
 * ==================================================
 ****************************************************/

const FIXED_CONFIGS = {

  M1: {

    shop: 'M1',

    employees: [
      'เกศ',
      'ปอย',
      'นุ๊ก',
      'นัต',
      'ฝน',
      'ตรี',
      'เกรซ',
      'หม๊ะ',
      'Seema',
      'Arjun',
      'Sandeep',
      'Raju',
      'Anju',
      'Win',
      'Aung'
    ]

  },


  M85: {

    shop: 'M85',

    employees: [
      'เกศ',
      'ปอย',
      'นุ๊ก',
      'นัต',
      'ฝน',
      'ตรี',
      'เกรซ',
      'หม๊ะ',
      'Seema',
      'Arjun',
      'Sandeep',
      'Raju',
      'Anju',
      'Win',
      'Aung'
    ]

  },


  M95: {

    shop: 'M95',

    employees: [
      'เกศ',
      'ปอย',
      'นุ๊ก',
      'นัต',
      'ฝน',
      'ตรี',
      'เกรซ',
      'หม๊ะ',
      'Seema',
      'Arjun',
      'Sandeep',
      'Raju',
      'Anju',
      'Win',
      'Aung'
    ]

  },


  M89: {

    shop: 'M89',

    employees: [
      'เกศ',
      'ปอย',
      'นุ๊ก',
      'นัต',
      'ฝน',
      'ตรี',
      'เกรซ',
      'หม๊ะ',
      'Seema',
      'Arjun',
      'Sandeep',
      'Raju',
      'Anju',
      'Win',
      'Aung'
    ]

  }

};


/****************************************************
 * SHIFT
 ****************************************************/

const SHIFT_OPTIONS = [

  '09.00-14.00',

  '14.00-18.00',

  '18.00-23.00'

];


/****************************************************
 * VARIABLES
 ****************************************************/

let lineProfile = null;

let currentShop = '';

let currentEmployees = [];

let selectedEmployees = [];

let selectedShifts = [];

let imageData = null;


/****************************************************
 * INIT
 ****************************************************/

window.addEventListener(
  'load',
  init
);


async function init() {

  setToday();


  try {

    /**********************************************
     * INIT LIFF
     **********************************************/

    await liff.init({

      liffId:
        LIFF_ID

    });


    /**********************************************
     * LOGIN
     **********************************************/

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    /**********************************************
     * PROFILE
     **********************************************/

    try {

      lineProfile =
        await liff.getProfile();

      document
        .getElementById(
          'userInfo'
        )
        .innerText =
          'ผู้ส่ง: ' +
          lineProfile.displayName;

    }

    catch (profileError) {

      console.warn(
        'getProfile failed',
        profileError
      );

      document
        .getElementById(
          'userInfo'
        )
        .innerText =
          'เข้าสู่ระบบ LINE แล้ว';

    }


    /**********************************************
     * LOCAL CONFIG
     **********************************************/

    initializeFixedConfig();

  }

  catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        'userInfo'
      )
      .innerText =
        'เกิดข้อผิดพลาด: ' +
        error.message;


    alert(
      'ไม่สามารถเปิด LIFF ได้\n\n' +
      error.message
    );

  }

}


/****************************************************
 * INIT FIXED CONFIG
 ****************************************************/

function initializeFixedConfig() {

  const shopSelect =
    document.getElementById(
      'shop'
    );


  shopSelect.value =
    '';


  currentShop =
    '';


  currentEmployees =
    [];


  selectedEmployees =
    [];


  renderEmployees(
    []
  );


  updateSelectedEmployees();

}


/****************************************************
 * SHOP CHANGE
 ****************************************************/

function shopChanged() {

  const shop =
    document
      .getElementById(
        'shop'
      )
      .value;


  currentShop =
    shop;


  selectedEmployees =
    [];


  const config =
    FIXED_CONFIGS[
      shop
    ];


  if (!config) {

    currentEmployees =
      [];

    renderEmployees(
      []
    );

    updateSelectedEmployees();

    return;

  }


  currentEmployees =
    Array.isArray(
      config.employees
    )
      ? [
          ...config.employees
        ]
      : [];


  renderEmployees(
    currentEmployees
  );


  updateSelectedEmployees();

}


/****************************************************
 * RENDER EMPLOYEES
 ****************************************************/

function renderEmployees(
  employees
) {

  const list =
    document.getElementById(
      'employeeList'
    );


  list.innerHTML =
    '';


  if (
    !employees ||
    !employees.length
  ) {

    list.innerHTML =
      '<div style="padding:15px;color:#777;">' +
      'กรุณาเลือกร้านก่อน' +
      '</div>';

    return;

  }


  employees.forEach(
    function(
      name,
      index
    ) {

      const row =
        document.createElement(
          'label'
        );


      row.className =
        'employee-item';


      const checkbox =
        document.createElement(
          'input'
        );


      checkbox.type =
        'checkbox';


      checkbox.id =
        'employee_' +
        index;


      checkbox.value =
        name;


      checkbox.addEventListener(
        'change',
        employeeChanged
      );


      const text =
        document.createElement(
          'span'
        );


      text.innerText =
        name;


      row.appendChild(
        checkbox
      );


      row.appendChild(
        text
      );


      list.appendChild(
        row
      );

    }
  );

}


/****************************************************
 * TOGGLE EMPLOYEES
 ****************************************************/

function toggleEmployees() {

  const list =
    document.getElementById(
      'employeeList'
    );


  if (
    !currentEmployees.length
  ) {

    alert(
      'กรุณาเลือกร้านก่อน'
    );

    return;

  }


  list.classList.toggle(
    'show'
  );

}


/****************************************************
 * EMPLOYEE CHANGE
 ****************************************************/

function employeeChanged() {

  selectedEmployees =
    [];


  document
    .querySelectorAll(
      '#employeeList input[type="checkbox"]'
    )
    .forEach(
      function(
        checkbox
      ) {

        if (
          checkbox.checked
        ) {

          selectedEmployees.push(
            checkbox.value
          );

        }

      }
    );


  updateSelectedEmployees();

}


/****************************************************
 * UPDATE EMPLOYEES
 ****************************************************/

function updateSelectedEmployees() {

  const selector =
    document.getElementById(
      'employeeSelector'
    );


  const box =
    document.getElementById(
      'selectedEmployees'
    );


  if (
    !currentEmployees.length
  ) {

    selector.innerText =
      'กรุณาเลือกร้านก่อน';

    box.innerText =
      'ยังไม่ได้เลือกพนักงาน';

    return;

  }


  if (
    !selectedEmployees.length
  ) {

    selector.innerText =
      'แตะเพื่อเลือกพนักงาน';

    box.innerText =
      'ยังไม่ได้เลือกพนักงาน';

    return;

  }


  selector.innerText =
    'เลือกแล้ว ' +
    selectedEmployees.length +
    ' คน';


  box.innerText =
    selectedEmployees.join(
      ', '
    );

}


/****************************************************
 * SHIFTS
 ****************************************************/

function toggleShifts() {

  document
    .getElementById(
      'shiftList'
    )
    .classList.toggle(
      'show'
    );

}


function shiftChanged() {

  selectedShifts =
    [];


  document
    .querySelectorAll(
      '#shiftList input[type="checkbox"]'
    )
    .forEach(
      function(
        checkbox
      ) {

        if (
          checkbox.checked
        ) {

          selectedShifts.push(
            checkbox.value
          );

        }

      }
    );


  updateSelectedShifts();

}


function updateSelectedShifts() {

  const selector =
    document.getElementById(
      'shiftSelector'
    );


  const box =
    document.getElementById(
      'selectedShifts'
    );


  if (
    !selectedShifts.length
  ) {

    selector.innerText =
      'แตะเพื่อเลือกกะ';

    box.innerText =
      'ยังไม่ได้เลือกกะ';

    return;

  }


  selector.innerText =
    'เลือกแล้ว ' +
    selectedShifts.length +
    ' กะ';


  box.innerText =
    selectedShifts.join(
      ', '
    );

}


/****************************************************
 * DATE
 ****************************************************/

function setToday() {

  const now =
    new Date();


  const yyyy =
    now.getFullYear();


  const mm =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const dd =
    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    );


  document
    .getElementById(
      'date'
    )
    .value =
      yyyy +
      '-' +
      mm +
      '-' +
      dd;

}


/****************************************************
 * NUMBER
 ****************************************************/

function getNumber(
  id
) {

  return Number(
    document
      .getElementById(
        id
      )
      .value
  ) || 0;

}


/****************************************************
 * SALES CHECK
 ****************************************************/

function checkSales() {

  const total =
    getNumber('totalSales');

  const cash =
    getNumber('cash');

  const credit =
    getNumber('credit');

  const qr =
    getNumber('qr');

  const sum =
    cash +
    credit +
    qr;

  const box =
    document.getElementById('salesCheck');


  // ==========================================
  // ยอดขาย 0 บาท สามารถส่งได้
  // ==========================================

  if (
    total === 0 &&
    sum === 0
  ) {

    box.className =
      'check-box ok';

    box.innerText =
      '✓ ยอดขาย 0 บาท';

    return true;

  }


  // ==========================================
  // ตรวจสอบยอดขายปกติ
  // ==========================================

  if (
    Math.abs(
      total -
      sum
    ) <= 0.01
  ) {

    box.className =
      'check-box ok';

    box.innerText =
      '✓ ยอดขายถูกต้อง';

    return true;

  }


  // ==========================================
  // ยอดไม่ตรง
  // ==========================================

  box.className =
    'check-box error';

  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    total.toLocaleString() +
    ' ≠ ' +
    sum.toLocaleString();

  return false;

}


/****************************************************
 * EMPLOYEE SALES CHECK
 ****************************************************/

function checkEmployeeSales() {

  const total =
    getNumber(
      'employeeTotal'
    );


  const cash =
    getNumber(
      'employeeCash'
    );


  const qr =
    getNumber(
      'employeeQr'
    );


  const sum =
    cash +
    qr;


  const box =
    document.getElementById(
      'employeeCheck'
    );


  if (
    total === 0 &&
    sum === 0
  ) {

    box.className =
      'check-box';


    box.innerText =
      'กรุณากรอกยอดพนักงานซื้อ';


    return true;

  }


  if (
    Math.abs(
      total -
      sum
    ) <= 0.01
  ) {

    box.className =
      'check-box ok';


    box.innerText =
      '✓ ยอดพนักงานซื้อถูกต้อง';


    return true;

  }


  box.className =
    'check-box error';


  box.innerText =
    'ยอดไม่ตรงกัน: ' +
    total.toLocaleString() +
    ' ≠ ' +
    sum.toLocaleString();


  return false;

}

/****************************************************
 * PHOTO
 ****************************************************/

function photoSelected(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  if (
    !file.type.startsWith(
      'image/'
    )
  ) {

    alert(
      'กรุณาเลือกไฟล์รูปภาพ'
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      imageData = {

        data:
          e.target.result,

        name:
          file.name,

        mimeType:
          file.type

      };


      const preview =
        document.getElementById(
          'photoPreview'
        );


      preview.src =
        e.target.result;


      preview.style.display =
        'block';


      document
        .getElementById(
          'photoText'
        )
        .style.display =
          'none';

    };


  reader.readAsDataURL(
    file
  );

}


/****************************************************
 * SUBMIT
 ****************************************************/

async function submitForm() {

  const shop =
    currentShop;


  const date =
    document
      .getElementById(
        'date'
      )
      .value;


  /**************************************************
   * VALIDATE SHOP
   **************************************************/

  if (!shop) {

    alert(
      'กรุณาเลือกร้าน'
    );

    return;

  }


  /**************************************************
   * VALIDATE DATE
   **************************************************/

  if (!date) {

    alert(
      'กรุณาเลือกวันที่'
    );

    return;

  }


  /**************************************************
   * VALIDATE SHIFT
   **************************************************/

  if (
    !selectedShifts.length
  ) {

    alert(
      'กรุณาเลือกกะอย่างน้อย 1 กะ'
    );

    return;

  }


  /**************************************************
   * VALIDATE EMPLOYEE
   **************************************************/

  if (
    !selectedEmployees.length
  ) {

    alert(
      'กรุณาเลือกพนักงานอย่างน้อย 1 คน'
    );

    return;

  }


  /**************************************************
   * SALES
   **************************************************/

  if (
    !checkSales()
  ) {

    alert(
      'กรุณาตรวจสอบยอดขาย\n\n' +
      'เงินสด + เครดิต + QR ' +
      'ต้องเท่ากับรวมยอดขาย'
    );

    return;

  }


  /**************************************************
   * EMPLOYEE SALES
   **************************************************/

  if (
    !checkEmployeeSales()
  ) {

    alert(
      'กรุณาตรวจสอบยอดพนักงานซื้อ'
    );

    return;

  }


  /**************************************************
   * PHOTO
   **************************************************/

  if (!imageData) {

    alert(
      'กรุณาแนบรูปใบส่งยอด'
    );

    return;

  }


  /**************************************************
   * DATA
   **************************************************/

  const data = {

    lineUserId:

      lineProfile
        ? lineProfile.userId
        : '',


    lineName:

      lineProfile
        ? lineProfile.displayName
        : '',


    shop:
      shop,


    date:
      date,


    shift:
      selectedShifts.join(
        ', '
      ),


    totalSales:
      getNumber(
        'totalSales'
      ),


    cash:
      getNumber(
        'cash'
      ),


    credit:
      getNumber(
        'credit'
      ),


    qr:
      getNumber(
        'qr'
      ),


    employeeTotal:
      getNumber(
        'employeeTotal'
      ),


    employeeCash:
      getNumber(
        'employeeCash'
      ),


    employeeQr:
      getNumber(
        'employeeQr'
      ),


    simSales:
      getNumber(
        'simSales'
      ),


    employees:
      selectedEmployees,

    note:
      document
        .getElementById('note')
        .value
        .trim(),
        
    image:
      imageData

  };


  /**************************************************
   * SEND
   **************************************************/

  document
    .getElementById(
      'submitBtn'
    )
    .disabled =
      true;


  showLoading(
    'กำลังส่งข้อมูล...'
  );


  try {

    await sendToGoogleAppsScript(
      data
    );


    hideLoading();


    alert(
      '✓ บันทึกรายงานเรียบร้อยแล้ว'
    );


    resetForm();

  }

  catch (error) {

    hideLoading();


    document
      .getElementById(
        'submitBtn'
      )
      .disabled =
        false;


    alert(
      'เกิดข้อผิดพลาด\n\n' +
      error.message
    );

  }

}


/****************************************************
 * SEND TO GAS
 *
 * ใช้ no-cors เพื่อไม่ติด CORS
 ****************************************************/

function sendToGoogleAppsScript(
  data
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      fetch(
        API_URL,
        {

          method:
            'POST',

          mode:
            'no-cors',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              data
            )

        }
      )
      .then(
        function() {

          /*
           * no-cors อ่าน response ไม่ได้
           * แต่ request ถูกส่งไป Apps Script แล้ว
           */

          resolve({
            success: true
          });

        }
      )
      .catch(
        function(error) {

          reject(
            error
          );

        }
      );

    }
  );

}


/****************************************************
 * RESET
 ****************************************************/

function resetForm() {

  document
    .querySelectorAll(
      'input[type="number"]'
    )
    .forEach(
      function(input) {

        input.value =
          '';

      }
    );


  selectedEmployees =
    [];


  selectedShifts =
    [];


  document
    .querySelectorAll(
      '#shiftList input[type="checkbox"]'
    )
    .forEach(
      function(cb) {

        cb.checked =
          false;

      }
    );


  document
    .querySelectorAll(
      '#employeeList input[type="checkbox"]'
    )
    .forEach(
      function(cb) {

        cb.checked =
          false;

      }
    );


  updateSelectedEmployees();

  updateSelectedShifts();


  imageData =
    null;

  document
    .getElementById('note')
    .value = '';
  
  document
    .getElementById(
      'photo'
    )
    .value =
      '';


  document
    .getElementById(
      'photoPreview'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'photoText'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'submitBtn'
    )
    .disabled =
      false;


  checkSales();

  checkEmployeeSales();

}


/****************************************************
 * LOADING
 ****************************************************/

function showLoading(
  text
) {

  document
    .getElementById(
      'loadingText'
    )
    .innerText =
      text ||
      'กำลังโหลด...';


  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'show'
    );

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList.remove(
      'show'
    );

}
